name: Publish

on:
  push:
    branches: [ '1.12.x' ]

permissions:
  contents: read

jobs:
  build:
    uses: MinecraftForge/SharedActions/.github/workflows/gradle.yml@main
    with:
      java: 8
      # Removido 'publish' para compilar apenas o seu instalador local
      gradle_tasks: 'ciWriteBuildNumber setup build'
      legacy_prefix: 14
      legacy_build_number: 2848
      artifact_name: 'forge'
    secrets:
      # Deixamos as outras chaves limpas para o robô oficial do Forge não reclamar
      PROMOTE_ARTIFACT_WEBHOOK: ${{ secrets.PROMOTE_ARTIFACT_WEBHOOK }}
      PROMOTE_ARTIFACT_USERNAME: ${{ secrets.PROMOTE_ARTIFACT_USERNAME }}
      PROMOTE_ARTIFACT_PASSWORD: ${{ secrets.PROMOTE_ARTIFACT_PASSWORD }}
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
