name: Publish

on:
  push:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew ciWriteBuildNumber setup genPatches build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PotatoForge
          path: build/libs/
